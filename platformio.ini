[platformio]
boards_dir = boards

[common]
platform = espressif32
framework = arduino
; Stamp the build with the short git commit hash (shown on the about page;
; CI uses the same hash in artifact names).
extra_scripts = pre:tools/build_info.py
; Dual-boot partition table (ota_0 = this project, ota_1 = StarForgeOS).
; See partitions.csv — keep in sync with the StarForgeOS build.
board_build.partitions = partitions.csv
lib_deps = 
	olikraus/U8g2@^2.36.5
	esp32async/ESPAsyncWebServer@^3.7.7
	esp32async/AsyncTCP@^3.4.1
	bblanchon/ArduinoJson@^7.4.1

[C3]
board = esp32-c3-devkitm-1
build_flags = 
    -D PREVIOUS_BUTTON_PIN=21
    -D SELECT_BUTTON_PIN=20
    -D NEXT_BUTTON_PIN=10
    -D BATTERY_VOLTAGE_OFFSET=1
    -D MIN_LOW_BATTERY_TIME=1000
    -D SPI_DATA_PIN=6
    -D SPI_LE_PIN=7
    -D SPI_CLK_PIN=4
    -D RSSI_PIN=3
    -D BUZZER_PIN=2
    -D BATTERY_PIN=0
    -D SCL_PIN=9
    -D SDA_PIN=8
    -D WIFI_SSID=\"NuclearCounter\"
    -D WIFI_PASSWORD=\"nuclearcounter\"

[SH1106]
build_flags = 
    -D SH1106

[SH1306]
build_flags = 
    -D SH1306

[env:C3-SH1106]
extends = common, C3, SH1106
build_flags = 
    ${C3.build_flags}
    ${SH1106.build_flags}

[env:C3-SH1306]
extends = common, C3, SH1306
build_flags = 
    ${C3.build_flags}
    ${SH1306.build_flags}

; Next/Prev button pins need to be reversed
; V2.0 = original build: no display flag (SSD1306 driver). Note: an env's own
; build_flags REPLACE the extended sections' flags, so the flag must be listed
; here explicitly (same reason C3-SH1106 uses ${...} references).
[env:NuclearCounterV2_0]
extends = common, C3
build_flags = 
    -D PREVIOUS_BUTTON_PIN=10
    -D SELECT_BUTTON_PIN=20
    -D NEXT_BUTTON_PIN=21
    -D BATTERY_VOLTAGE_OFFSET=0
    -D MIN_LOW_BATTERY_TIME=1000
    -D SPI_DATA_PIN=6
    -D SPI_LE_PIN=7
    -D SPI_CLK_PIN=4
    -D RSSI_PIN=3
    -D BUZZER_PIN=2
    -D BATTERY_PIN=0
    -D SCL_PIN=9
    -D SDA_PIN=8
    -D WIFI_SSID=\"NuclearCounter\"
    -D WIFI_PASSWORD=\"nuclearcounter\"

; V2.1: reference-design C3 hardware with the new SH1306 display code.
; Uses the reference-design button pins (PREV=21 / NEXT=10) via ${C3.build_flags}
; — the reversed 10/21 pins belong to the old non-reference (V1) boards.
; USB CDC flags kept so the serial port stays alive for dual-boot flashing.
[env:NuclearCounterV2_1]
extends = common, C3, SH1306
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ${C3.build_flags}
    ${SH1306.build_flags}

; V3.0 on C3: same INTEGRATED firmware as the S3 build, on the reference-design
; C3 hardware (SH1306, PREV=21 / NEXT=10). Differences from the S3 env:
;  - no core pinning (C3 is single-core; see the chip-aware CONFIG_SINGLE_CORE
;    in src/config/config.h and the guards in RX5808.cpp / timing_core.cpp)
;  - RSSI history stays at 10000 samples (C3 has more headroom than the S3,
;    but the same value keeps the two builds behaviourally identical)
[env:NuclearCounterV3_0_C3]
extends = common, C3, SH1306
lib_deps = 
	olikraus/U8g2@^2.36.5
	mathieucarbou/ESPAsyncWebServer@^3.3.21
	bblanchon/ArduinoJson@^6.21.3
	ESPmDNS
board_build.filesystem = spiffs
build_flags = 
    -D INTEGRATED=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ${C3.build_flags}
    ${SH1306.build_flags}
    ; Single-core: AsyncTCP runs on core 0 with the timing task (no pinning).
    -DCONFIG_ASYNC_TCP_PRIORITY=1
    ; TCP tuning for reliable web file serving (same as the S3 env)
    -DCONFIG_TCP_SND_BUF_DEFAULT=8192
    -DCONFIG_TCP_WND_DEFAULT=8192
    -DCONFIG_LWIP_TCP_KEEPALIVE=1
    -DCONFIG_LWIP_TCP_KEEPIDLE_DEFAULT=300
    -DCONFIG_LWIP_TCP_KEEPINTVL_DEFAULT=75
    -DCONFIG_LWIP_TCP_KEEPCNT_DEFAULT=9
    -DCONFIG_LWIP_TCP_MSL=60000
    -DCONFIG_LWIP_SO_RCVTIMEO=1

; Bench-only target (never built by CI): measures the RSSI sample-interval
; distribution in the timing task (-DTIMING_JITTER_PROBE) and boots directly
; into the WiFi timer page (-DDEBUG_BOOT_TIMER) so the AP is reachable over USB
; serial on the bench without anyone pressing SELECT.
[env:JITTER_C3]
extends = common, C3, SH1306
lib_deps = 
	olikraus/U8g2@^2.36.5
	mathieucarbou/ESPAsyncWebServer@^3.3.21
	bblanchon/ArduinoJson@^6.21.3
	ESPmDNS
board_build.filesystem = spiffs
build_flags = 
    -D INTEGRATED=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ${C3.build_flags}
    ${SH1306.build_flags}
    -DCONFIG_ASYNC_TCP_PRIORITY=1
    -DCONFIG_TCP_SND_BUF_DEFAULT=8192
    -DCONFIG_TCP_WND_DEFAULT=8192
    -DCONFIG_LWIP_TCP_KEEPALIVE=1
    -DCONFIG_LWIP_TCP_KEEPIDLE_DEFAULT=300
    -DCONFIG_LWIP_TCP_KEEPINTVL_DEFAULT=75
    -DCONFIG_LWIP_TCP_KEEPCNT_DEFAULT=9
    -DCONFIG_LWIP_TCP_MSL=60000
    -DCONFIG_LWIP_SO_RCVTIMEO=1
    -D TIMING_JITTER_PROBE=1
    -D DEBUG_BOOT_TIMER=1

[env:NuclearCounterV3_0]
extends = common
board = esp32-s3-devkitc-1-4MB
; INTEGRATED build: SFOS-ported timing engine + RotorHazard USB node + WiFi web
; timer (see src/integrated.*, src/timing_core.*, src/node_mode.*, src/web/).
; The ported web stack (web_server.cpp / ota_manager.cpp) was written against
; the mathieucarbou ESPAsyncWebServer fork + ArduinoJson 6, so this env uses
; SFOS's exact lib set instead of the common esp32async/ArduinoJson-7 set.
lib_deps = 
	olikraus/U8g2@^2.36.5
	mathieucarbou/ESPAsyncWebServer@^3.3.21
	bblanchon/ArduinoJson@^6.21.3
	ESPmDNS
; SFOS web UI (data/: index.html, app.js, style.css) is served from SPIFFS.
; `pio run -e NuclearCounterV3_0 -t buildfs` produces spiffs.bin, which is
; flashed to the spiffs partition (0x330000) by tools/flash.sh.
board_build.filesystem = spiffs
; build_flags REPLACE the extended section's flags (extends does not merge),
; so every flag is listed here explicitly.
; ARDUINO_USB_CDC_ON_BOOT keeps a USB serial port alive while this firmware runs, so
; esptool can auto-enter download mode for dual-boot flashing (no manual
; BOOT+EN needed). The RotorHazard node protocol also runs over this CDC port.
build_flags = 
    -D INTEGRATED=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D SH1306
    -D PREVIOUS_BUTTON_PIN=12
    -D SELECT_BUTTON_PIN=11
    -D NEXT_BUTTON_PIN=10
    -D BATTERY_VOLTAGE_OFFSET=0
    -D MIN_LOW_BATTERY_TIME=1000
    -D SPI_DATA_PIN=6
    -D SPI_LE_PIN=7
    -D SPI_CLK_PIN=4
    -D RSSI_PIN=3
    -D BUZZER_PIN=2
    -D BATTERY_PIN=1
    -D SCL_PIN=9
    -D SDA_PIN=8
    -D WIFI_SSID=\"NuclearCounter\"
    -D WIFI_PASSWORD=\"nuclearcounter\"
    ; Core split: the 1ms timing task owns core 1 (pinned, prio 2); pin the
    ; web server (AsyncTCP) task to core 0 at prio 1 so HTTP polling can
    ; never preempt lap timing. (Same as the SFOS S3 env.)
    -DCONFIG_SINGLE_CORE=0
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_PRIORITY=1
    ; TCP tuning for reliable web file serving (from SFOS)
    -DCONFIG_TCP_SND_BUF_DEFAULT=8192
    -DCONFIG_TCP_WND_DEFAULT=8192
    -DCONFIG_LWIP_TCP_KEEPALIVE=1
    -DCONFIG_LWIP_TCP_KEEPIDLE_DEFAULT=300
    -DCONFIG_LWIP_TCP_KEEPINTVL_DEFAULT=75
    -DCONFIG_LWIP_TCP_KEEPCNT_DEFAULT=9
    -DCONFIG_LWIP_TCP_MSL=60000
    -DCONFIG_LWIP_SO_RCVTIMEO=1
